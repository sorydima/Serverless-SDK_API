name: Prompt & Smoke CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  prompt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run prompt tests
        run: |
          python -m pytest tests/test_prompt_library.py tests/test_prompt_cli.py -q

  smoke-runner:
    runs-on: ubuntu-latest
    needs: prompt-tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ci-requirements.txt') }}
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest aiohttp websockets
      - name: Run smoke runner
        run: |
          python tools/run_smoke_tests.py
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: smoke-runner-artifacts
          path: |
            .demo_data_lake
            .smoke_vibe_vault
            smoke_backlog.csv

  full-tests:
    runs-on: ubuntu-latest
    needs: prompt-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-full-${{ hashFiles('ci-requirements.txt') }}
      - name: Install CI requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
      - name: Run full test suite (may be long)
        run: |
          python -m pytest -q || true
      - name: Upload pytest logs
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: |
            .pytest_cache
            pytest-report.xml