version: '3.8'

# Security-focused Docker Compose override

services:
  # Security Services
  vault:
    image: vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - vault_data:/vault/file
      - ./infra/security/vault-config.hcl:/vault/config/vault-config.hcl
    networks:
      - security
    cap_add:
      - IPC_LOCK

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-master:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      - postgres-master
    networks:
      - backend
      - security

  traefik:
    image: traefik:v2.9
    ports:
      - "80:80"
      - "443:443"
      - "8084:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/security/traefik.yml:/etc/traefik/traefik.yml
      - ./infra/security/dynamic.yml:/etc/traefik/dynamic.yml
      - traefik_certs:/certs
    networks:
      - backend
      - security
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"

  # Enhanced PostgreSQL with security
  postgres-master:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./infra/postgres/master-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/security/postgres-security.sql:/docker-entrypoint-initdb.d/security.sql
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Enhanced Redis with security
  redis-1:
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true

  redis-2:
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true

  redis-3:
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true

  # Security-enhanced microservices
  mesh-gateway:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mesh-gateway.rule=Host(`mesh-gateway.localhost`)"
      - "traefik.http.routers.mesh-gateway.tls=true"
      - "traefik.http.services.mesh-gateway.loadbalancer.server.port=8080"

  ai-core:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-core.rule=Host(`ai-core.localhost`)"
      - "traefik.http.routers.ai-core.tls=true"
      - "traefik.http.services.ai-core.loadbalancer.server.port=8081"

  storage:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storage.rule=Host(`storage.localhost`)"
      - "traefik.http.routers.storage.tls=true"
      - "traefik.http.services.storage.loadbalancer.server.port=8082"

  # Monitoring with security
  prometheus:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  grafana:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

volumes:
  vault_data:
  traefik_certs:

networks:
  security:
    driver: bridge
    internal: true
